<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Connections -->
  <line x1="50" y1="50" x2="20" y2="30" stroke="#5F6B78" stroke-width="4" stroke-linecap="round"/>
  <line x1="50" y1="50" x2="70" y2="20" stroke="#5F6B78" stroke-width="4" stroke-linecap="round"/>
  <line x1="50" y1="50" x2="85" y2="65" stroke="#5F6B78" stroke-width="4" stroke-linecap="round"/>
  <line x1="50" y1="50" x2="35" y2="85" stroke="#5F6B78" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Outer Nodes -->
  <circle cx="20" cy="30" r="8" fill="#5F6B78"/>
  <circle cx="70" cy="20" r="6" fill="#5F6B78"/>
  <circle cx="85" cy="65" r="7" fill="#5F6B78"/>
  <circle cx="35" cy="85" r="9" fill="#5F6B78"/>

  <!-- Blast Radius Ring -->
  <circle cx="50" cy="50" r="18" fill="none" stroke="#2E7D79" stroke-width="2" stroke-dasharray="4 4"/>

  <!-- Center Vulnerable Node -->
  <circle cx="50" cy="50" r="12" fill="#2E7D79"/>
</svg>
